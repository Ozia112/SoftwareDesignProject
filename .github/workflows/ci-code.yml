name: CI Code

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".eslintrc*"
      - ".prettierrc*"
      - ".github/workflows/ci-code.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".eslintrc*"
      - ".prettierrc*"
      - ".github/workflows/ci-code.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-graph-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  repository-graph:
    name: Update repository graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graph dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate graph indexes
        run: python build-graph.py --pretty

      - name: Commit graph updates
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if git diff --quiet -- .graph; then
            echo "Repository graph is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .graph
            git commit -m "chore: update repository graph"
            git push
          fi

      - name: Verify graph is up to date
        run: |
          if git diff --quiet -- .graph; then
            echo "Repository graph is up to date."
          else
            echo "::error::Repository graph is stale. Run 'python build-graph.py --pretty' and commit .graph/."
            git diff -- .graph
            exit 1
          fi

  code:
    name: TypeScript and services
    runs-on: ubuntu-latest
    needs: repository-graph
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test?schema=public
      REDIS_URL: redis://localhost:6379
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Node project
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json not found; skipping TypeScript CI until src/ is implemented."
          fi

      - name: Set up pnpm
        if: steps.project.outputs.has_node == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        if: steps.project.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.project.outputs.has_node == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: ESLint
        if: steps.project.outputs.has_node == 'true'
        run: pnpm run --if-present lint

      - name: Prettier format check
        if: steps.project.outputs.has_node == 'true'
        run: pnpm run --if-present format:check

      - name: TypeScript type-check
        if: steps.project.outputs.has_node == 'true'
        run: |
          if [ -f tsconfig.json ]; then
            pnpm exec tsc --noEmit
          else
            echo "::notice::tsconfig.json not found; skipping type-check."
          fi

      - name: Prisma schema validate
        if: steps.project.outputs.has_node == 'true'
        run: |
          if [ -f prisma/schema.prisma ]; then
            pnpm exec prisma validate
          else
            echo "::notice::prisma/schema.prisma not found; skipping Prisma validation."
          fi

      - name: Prisma migrate deploy
        if: steps.project.outputs.has_node == 'true'
        run: |
          if [ -d prisma/migrations ]; then
            pnpm exec prisma migrate deploy
          else
            echo "::notice::prisma/migrations not found; skipping migration deploy."
          fi

      - name: Jest coverage
        if: steps.project.outputs.has_node == 'true'
        run: pnpm run --if-present test:cov

      - name: NestJS build
        if: steps.project.outputs.has_node == 'true'
        run: pnpm run --if-present build
