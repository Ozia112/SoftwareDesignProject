name: CI Docs

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "docs/**"
      - "utils/**"
      - "*.md"
      - ".markdownlint*"
      - ".github/workflows/ci-docs.yml"
      - "build-graph.py"
      - "requirements.txt"
  push:
    branches:
      - develop
      - main
    paths:
      - "docs/**"
      - "utils/**"
      - "*.md"
      - ".markdownlint*"
      - ".github/workflows/ci-docs.yml"
      - "build-graph.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-graph-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  repository-graph:
    name: Update repository graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graph dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate graph indexes
        run: python build-graph.py --pretty

      - name: Commit graph updates
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if git diff --quiet -- .graph; then
            echo "Repository graph is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .graph
            git commit -m "chore: update repository graph"
            git push
          fi

      - name: Verify graph is up to date
        run: |
          if git diff --quiet -- .graph; then
            echo "Repository graph is up to date."
          else
            echo "::error::Repository graph is stale. Run 'python build-graph.py --pretty' and commit .graph/."
            git diff -- .graph
            exit 1
          fi

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    needs: repository-graph
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Markdownlint
        run: >-
          pnpm dlx markdownlint-cli2
          "*.md"
          "docs/**/*.md"
          "!**/*Plantilla*.md"
          "!**/*plantilla*.md"
          "!**/templates/**/*.md"
          "!docs/soporte/entregas/**/*.md"
          "!docs/soporte/prompt/**/*.md"
          "!docs/soporte/prompts/**/*.md"
          "!docs/soporte/workflow/**/*.md"
          "!utils/**/*.md"
