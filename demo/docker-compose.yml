version: '3.9'

# ============================================================
# Demo stack — solo para pruebas. Borrar: rm -rf demo/
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-demo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: saas_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d saas_dev']
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: saas-demo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  orchestrator:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: saas-demo-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://app:app@postgres:5432/saas_dev
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JWT_SECRET: demo-jwt-secret
      THROTTLE_TTL: '60'
      THROTTLE_LIMIT: '1000'
      OTEL_ENABLED: 'false'
      # GUI en :8080 necesita permiso CORS para llamar al orquestador en :3000
      CORS_ORIGINS: 'http://localhost:8080,http://127.0.0.1:8080'
    volumes:
      - demo_logs:/app/demo/logs/sessions
      - ./eventos:/app/demo/eventos   # JSONs de eventos: lectura en seed, escritura en reset
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # open-wa bridge — conecta WhatsApp Web al orquestador
  # Requiere escanear QR con tu teléfono la primera vez
  open-wa:
    build:
      context: ./open-wa-bridge
      dockerfile: Dockerfile
    container_name: saas-demo-openwa
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      ORCHESTRATOR_URL: http://orchestrator:3000
      TENANT_ID: demo-tenant
      BRIDGE_PORT: '4000'
    ports:
      - '4000:4000'
    volumes:
      - openwa_sessions:/app/.wa-sessions
    profiles:
      - whatsapp

  # GUI de demo — landing page estática servida por nginx
  gui:
    image: nginx:alpine
    container_name: saas-demo-gui
    restart: unless-stopped
    volumes:
      - ./gui:/usr/share/nginx/html:ro
    ports:
      - '8080:80'

volumes:
  pg_data:
  redis_data:
  openwa_sessions:
  demo_logs:
