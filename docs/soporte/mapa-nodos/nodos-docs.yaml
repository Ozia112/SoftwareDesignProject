schema: repo-node-map/v0.1
purpose: >
  Grafo inicial del repositorio para orientar agentes de IA, reducir tool calling
  exploratorio y preparar trazabilidad futura hacia codigo bajo src/.

entry_points:
  - id: AREA-ANALISIS
    when: "Necesidades, RF, RNF, CU, glosario, reglas de negocio o modelos del problema."
  - id: AREA-DISENO
    when: "Decisiones tecnicas, secuencia, colaboracion, arquitectura u orquestador."
  - id: AREA-SOPORTE
    when: "Workflow, reuniones, entregas, prompts, scripts y utilidades de trabajo."
  - id: AREA-SRC-FUTURO
    when: "Implementacion futura en src/ y trazabilidad codigo-documentacion."
  - id: AREA-DEMO
    when: "Datos demo, fixtures, ejemplos ejecutables o archivos de prueba manual."

relation_vocabulary:
  contains: "Agrupa nodos hijos."
  traces_to: "Declara trazabilidad directa."
  satisfies: "Indica que un caso de uso satisface uno o mas requerimientos funcionales."
  covers: "Agrupa los artefactos funcionales que una capacidad consolida como entrada de navegacion."
  applies_to: "Indica los artefactos, capacidades o anclas sobre los que aplica una regla de negocio."
  governed_by: "Queda condicionado por reglas o decisiones."
  models: "Indica que un diagrama o modelo representa casos de uso, dominios, capacidades o flujos."
  modeled_by: "Indica que una capacidad o artefacto esta representado por modelos o diagramas."
  derives_from: "Deriva de una fuente primaria."
  implements_future: "Relacion legada para anclas de implementacion futura; preferir planned_in o derives_from."
  planned_in: "Indica que un artefacto, regla o capacidad esta previsto en modulos, servicios o contratos futuros."
  supports: "Ayuda a producir, mantener o auditar."
  validated_by: "Indica fixtures, demos o evidencia que ejercitan una capacidad."
  exercises: "Indica que un fixture, demo o evidencia ejecuta o prueba capacidades, casos de uso o anclas."
  references: "Relacion contextual."

nodes:
  - id: REPO
    type: root
    title: SoftwareDesignProject
    path: .
    contains: [README, AREA-ANALISIS, AREA-DISENO, AREA-SOPORTE, AREA-SRC-FUTURO, AREA-DEMO]

  - id: README
    type: artifact
    title: README principal
    path: README.md
    tags: [kind:readme, area:root]
    aliases: [readme principal, repository readme, overview, introduccion, introducción]
    supports: [REPO, SUP-ENTREGAS]

  - id: AREA-ANALISIS
    type: area
    title: Documentacion de analisis
    path: docs/analisis
    purpose: "Problema, necesidades, reglas, requerimientos, casos de uso y modelos del dominio."
    tags: [area:analisis, kind:documentation-area]
    aliases: [analisis, análisis, requirements, requerimientos, reglas de negocio, casos de uso]
    contains:
      - DOM-GLOSARIO
      - DOM-RF-COM
      - DOM-RF-EVT
      - DOM-RNF
      - DOM-CU-COM
      - DOM-CU-EVT
      - DOM-RN-BASE
      - DOM-RN-COM
      - DOM-RN-EVT
      - DOM-MODELOS-PROBLEMA
      - DOM-CAPABILITIES

  - id: AREA-DISENO
    type: area
    title: Documentacion de diseno
    path: docs/diseño
    purpose: "Solucion tecnica, decisiones y comportamiento entre componentes."
    tags: [area:diseno, kind:documentation-area]
    aliases: [diseno, diseño, design, arquitectura, decisiones, comportamiento]
    contains: [DOM-ARQUITECTURA, DOM-DDR, DOM-SECUENCIA, DOM-COLABORACION]

  - id: AREA-SOPORTE
    type: area
    title: Documentacion de soporte
    path: docs/soporte
    purpose: "Operacion del equipo, evidencia, prompts, scripts y utilidades."
    tags: [area:soporte, kind:documentation-area]
    aliases: [soporte, workflow, prompts, scripts, utilidades, entregas]
    contains:
      - SUP-WORKFLOW
      - SUP-MEETINGS
      - SUP-ENTREGAS
      - SUP-PROMPTS
      - SUP-SCRIPTS
      - SUP-UTILS
      - SUP-MAPA-NODOS

  - id: AREA-DEMO
    type: area
    title: Datos demo y fixtures
    path: demo
    purpose: "Archivos de demostracion y datos de ejemplo para validar escenarios del dominio."
    tags: [area:demo, kind:demo-area, capability:fixtures, capability:validation]
    aliases: [demo, fixtures, datos demo, datos de ejemplo, sample data, validation data]
